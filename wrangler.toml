name = "onion-hono-api"
main = "src/cmd/worker.ts"
compatibility_date = "2026-06-20"
compatibility_flags = ["nodejs_compat"]

# Supabase 接続後に Hyperdrive を作成し、id を差し替えてください。
# npx wrangler hyperdrive create onion-hono-db --connection-string="<supabase-connection-string>"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[vars]
AUTH_COOKIE_SECURE = "true"
MEDIA_BASE_URL = "https://onion-hono-api.example.workers.dev/api/v1/media"

[env.dev]
[env.dev.vars]
AUTH_COOKIE_SECURE = "false"
MEDIA_BASE_URL = "http://localhost:8787/api/v1/media"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "macching-photos"
